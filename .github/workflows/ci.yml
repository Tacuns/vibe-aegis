name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported interpreter (3.8 images are only available on 22.04)
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero dependencies
        run: |
          if [ -f requirements.txt ]; then
            echo "::error::requirements.txt found - vibe-aegis must stay zero-dependency"
            exit 1
          fi
          echo "No Python dependencies required."

      - name: Run unit tests
        run: python3 -B -m unittest discover -s tests -v

  installer:
    name: Installer Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run installer for all agents
        run: bash install.sh --target /tmp/test-app --agent all

      - name: Verify installed files
        run: |
          set -e
          expected=(
            "/tmp/test-app/.aegis/scripts/aegis_scan.py"
            "/tmp/test-app/AGENTS.md"
            "/tmp/test-app/CLAUDE.md"
            "/tmp/test-app/.claude/skills/vibe-aegis/SKILL.md"
            "/tmp/test-app/.claude/skills/security-redteam-loop/SKILL.md"
            "/tmp/test-app/.claude/skills/ui-ux-bug-finder/SKILL.md"
            "/tmp/test-app/.claude/skills/artifact-leak-hunter/SKILL.md"
            "/tmp/test-app/.claude/skills/architecture-threat-model/SKILL.md"
            "/tmp/test-app/.claude/skills/payments-logic-auditor/SKILL.md"
            "/tmp/test-app/.claude/skills/ai-llm-security-shield/SKILL.md"
            "/tmp/test-app/.claude/skills/backend-reliability-scale/SKILL.md"
            "/tmp/test-app/.claude/skills/production-preflight-gate/SKILL.md"
            "/tmp/test-app/.claude/commands/aegis.md"
            "/tmp/test-app/.github/copilot-instructions.md"
            "/tmp/test-app/.github/prompts/aegis-audit.prompt.md"
            "/tmp/test-app/.vscode/tasks.json"
            "/tmp/test-app/.agents/skills/vibe-aegis/SKILL.md"
            "/tmp/test-app/.cursor/rules/vibe-aegis.mdc"
            "/tmp/test-app/.cursorrules"
            "/tmp/test-app/.windsurf/rules/vibe-aegis.md"
            "/tmp/test-app/.clinerules"
            "/tmp/test-app/GEMINI.md"
          )
          for f in "${expected[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing expected installed file: $f"
              exit 1
            fi
            echo "ok: $f"
          done

      - name: Verify skill frontmatter is parseable
        run: |
          set -e
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- "---" || { echo "::error::$f is missing opening YAML frontmatter delimiter"; exit 1; }
            echo "ok: $f"
          done

      - name: Run installed scanner against the installed project
        run: python3 /tmp/test-app/.aegis/scripts/aegis_scan.py /tmp/test-app

      - name: Verify the new deep-analysis stages run end to end
        run: |
          set -e
          mkdir -p /tmp/leak/dist/assets
          # Split so no contiguous valid-format key is stored in this file;
          # GitHub push protection blocks those, and rightly so.
          KEY="sk_live_""51QzAbCdEfGhIjKlMnOpQrStUv0123456789wxyz"
          TAIL="51QzAbCdEfGhIjKlMnOpQrStUv""0123456789wxyz"
          printf 'STRIPE_SECRET_KEY=%s\n' "$KEY" > /tmp/leak/.env.local
          printf 'const K="%s";export default K;' "$KEY" > /tmp/leak/dist/assets/index.js
          printf '{"version":3,"sourcesContent":["x"]}' > /tmp/leak/dist/assets/index.js.map

          python3 scripts/aegis_scan.py /tmp/leak --artifact /tmp/leak/dist --offline             --output /tmp/leak/report.json --sarif /tmp/leak/out.sarif > /dev/null

          TAIL="$TAIL" python3 - <<'PY'
          import json, os, sys
          r = json.load(open("/tmp/leak/report.json"))
          ids = {f["rule_id"] for f in r["findings"]}
          for required in ("ART-01", "ART-02"):
              if required not in ids:
                  print(f"::error::{required} did not fire on the leak fixture ({sorted(ids)})")
                  sys.exit(1)
          # A report may be committed or attached to an issue - it must never carry a live key.
          raw = open("/tmp/leak/report.json").read()
          if os.environ["TAIL"] in raw:
              print("::error::report contains an unredacted credential")
              sys.exit(1)
          sarif = json.load(open("/tmp/leak/out.sarif"))
          assert sarif["version"] == "2.1.0", "SARIF version wrong"
          assert sarif["runs"][0]["results"], "SARIF has no results"
          print(f"Deep stages OK: {sorted(ids)}; credentials redacted; SARIF valid")
          PY

      - name: Verify the release gate exit codes
        run: |
          set +e
          python3 scripts/aegis_scan.py /tmp/leak --offline --quiet --fail-on-high > /dev/null
          code=$?
          set -e
          if [ "$code" != "1" ]; then echo "::error::--fail-on-high should exit 1, got $code"; exit 1; fi
          echo "Release gate exits 1 on blocking findings, as designed."

      - name: Verify baseline adoption suppresses pre-existing findings
        run: |
          set -e
          python3 scripts/aegis_scan.py /tmp/leak --offline --write-baseline /tmp/leak/baseline.json > /dev/null
          out=$(python3 scripts/aegis_scan.py /tmp/leak --offline --baseline /tmp/leak/baseline.json --quiet)
          echo "$out"
          case "$out" in
            *"100/100"*) echo "Baseline suppression works." ;;
            *) echo "::error::baseline did not suppress known findings: $out"; exit 1 ;;
          esac


      - name: Verify the fail-closed readiness contract
        run: |
          set -e
          python3 - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import aegis_scan as a

          # 1. An empty directory must never certify.
          with tempfile.TemporaryDirectory() as t:
              f, n = a.scan_repository(Path(t))
          score, verdict = a.compute_readiness_score(f, scanned_files=n)
          assert n == 0 and score == 0 and verdict.startswith("INCOMPLETE_SCAN"), verdict

          # 2. The reported isolation call must never certify.
          f = a.check_dependency_vulnerabilities([("PyPI", "Django", "2.2.0")], offline=True)
          assert a.compute_readiness_score(f)[1] != "READY TO PUBLISH"

          # 3. A hand-built -00 with no markers must never certify.
          bare = a.Finding("DEP-00", "SUPPLY_CHAIN", "LOW", "Skipped", "deps", 0,
                           "x", "Informational", "re-run")
          assert a.compute_readiness_score([bare])[1] != "READY TO PUBLISH"

          # 4. A genuinely clean repo must still pass, or the gate is useless.
          with tempfile.TemporaryDirectory() as t:
              (Path(t) / "ok.js").write_text("export const add=(a,b)=>a+b;\n", encoding="utf-8")
              f, n = a.scan_repository(Path(t))
          assert a.compute_readiness_score(f, scanned_files=n) == (100, "READY TO PUBLISH")
          print("Fail-closed contract holds on all four paths.")
          PY

      - name: Verify the installer is idempotent
        run: |
          set -e
          rm -rf /tmp/idem
          bash install.sh --target /tmp/idem --agent all > /dev/null
          a=$(find /tmp/idem -type f | wc -l)
          bash install.sh --target /tmp/idem --agent all > /dev/null
          b=$(find /tmp/idem -type f | wc -l)
          if [ "$a" != "$b" ]; then
            echo "::error::install.sh is not idempotent ($a -> $b files)"; exit 1
          fi
          # and a target path containing spaces
          rm -rf "/tmp/my app dir"
          bash install.sh --target "/tmp/my app dir" --agent claude-code > /dev/null
          test -f "/tmp/my app dir/.aegis/scripts/aegis_scan.py"             || { echo "::error::install.sh broke on a path with spaces"; exit 1; }
          echo "Installer is idempotent and space-safe ($a files)."

      - name: Validate JSON report against schema
        run: |
          set -e
          python3 scripts/aegis_scan.py . --json --output /tmp/scan-report.json > /dev/null
          python3 - <<'PY'
          import json, sys
          report = json.load(open("/tmp/scan-report.json"))
          schema = json.load(open("schemas/scan-report.schema.json"))
          required = schema["required"]
          missing = [k for k in required if k not in report]
          if missing:
              print(f"::error::Report is missing required schema keys: {missing}")
              sys.exit(1)
          for f in report["findings"]:
              fmissing = [k for k in schema["$defs"]["finding"]["required"] if k not in f]
              if fmissing:
                  print(f"::error::Finding missing required keys: {fmissing}")
                  sys.exit(1)
          print(f"Schema check passed: {len(report['findings'])} findings, score {report['readiness_score']}/100")
          PY
